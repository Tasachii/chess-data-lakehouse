[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chess-data-lakehouse"
version = "0.2.0"
description = "Bounded, reproducible Lichess bronze/silver/gold data pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "certifi>=2026.9.9,<2027",
  "zstandard>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<0.9",
]
spark = [
  "delta-spark==3.3.2",
  "pyspark==3.5.3",
]

[project.scripts]
chess-lakehouse = "chess_lakehouse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_lakehouse"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: Chess Lakehouse CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    name: Python and dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and test tools
        run: python -m pip install -e '.[dev]'
      - name: Run base tests
        run: python -m pytest -ra
      - name: Check Python style
        run: |
          python -m ruff check .
          python -m ruff format --check src tests scripts
      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/dashboard.js
          node --check scripts/test_dashboard.cjs

  spark-fixtures:
    name: Spark and Delta fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Spark and Delta test tools
        run: python -m pip install -e '.[dev,spark]'
      - name: Download matching Delta JARs
        run: |
          mkdir -p output/spark-deps/jars
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://repo.maven.apache.org/maven2/io/delta/delta-spark_2.12/3.3.2/delta-spark_2.12-3.3.2.jar \
            -o output/spark-deps/jars/delta-spark_2.12-3.3.2.jar
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://repo.maven.apache.org/maven2/io/delta/delta-storage/3.3.2/delta-storage-3.3.2.jar \
            -o output/spark-deps/jars/delta-storage-3.3.2.jar
      - name: Run local Spark and Delta fixture tests
        env:
          SPARK_LOCAL_IP: '127.0.0.1'
          PYSPARK_PYTHON: python
          CHESS_TEST_DELTA: '1'
          CHESS_DELTA_JARS: ${{ github.workspace }}/output/spark-deps/jars/delta-spark_2.12-3.3.2.jar,${{ github.workspace }}/output/spark-deps/jars/delta-storage-3.3.2.jar
        run: python -m pytest -ra tests/test_spark_parity.py

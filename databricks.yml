bundle:
  name: chess-data-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog containing the target schema
    default: main
  schema:
    description: Schema created for the portfolio tables
    default: chess_portfolio
  source_path:
    description: Decompressed PGN path or glob in a Unity Catalog volume
    default: /Volumes/main/chess_portfolio/input/real_sample_100.pgn

  source_url:
    description: Publisher URL corresponding to the uploaded sample
    default: https://database.lichess.org/standard/lichess_db_standard_rated_2026-10.pgn.zst
  requested_max_games:
    description: Downloader sample bound from its receipt (change for other inputs)
    default: "100"
  expected_source_sha256:
    description: Decompressed sample SHA-256 from its download receipt, blank if unknown
    default: ""
  retrieved_at_utc:
    description: Actual retrieval timestamp from download receipt, blank if unknown
    default: ""

targets:
  dev:
    mode: development
    default: true
